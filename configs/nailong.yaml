# ---- 摄像头选择 ----
# "hikrobot" = 海康工业相机（MV-CS016-10UC，参考 sp_vision standard_mpc）
# "video0"  = USB 相机（V4L，/dev/videoX）
camera_name: "hikrobot"

# ---- 检测器选择 ----
# "yolox" = YOLOX 检测模型（推荐，直接输出识别框，CPU 实时）
# "grid"  = ResNet50 二分类 + 网格定位（旧方案，兼容保留）
detector: "yolox"

# ---- 工业相机参数（海康 MV-CS016-10UC）----
exposure_ms: 2
gain: 16
vid_pid: "2bdf:0001"

# ---- USB 相机参数（camera_name 为 video0 时生效）----
image_width: 1280
image_height: 720
usb_frame_rate: 30
usb_exposure: -5

# ---- YOLOX 检测参数 ----
yolox_model_path: "model/nailong_v2.6_tiny.onnx"
yolox_input_size: 416         # tiny 模型输入尺寸
yolox_confidence: 0.3         # 置信度阈值
yolox_nms: 0.45               # NMS IoU 阈值
yolox_class_id: 1
yolox_expand: 3.0             # 框扩展系数：模型只框脸部核心，3.0 外扩包住整个头（跟踪用中心，不受影响）             # labels.txt: 0=bg 1=nailong 2=anime 3=human 4=emoji 5=long 6=other 7=htgt

# ---- 解算参数（格式同 sp_vision standard3.yaml）----
# camera_matrix / distort_coeffs 为占位值，需用 calibration/calibrate_camera.cpp 标定后替换
# 当前分辨率 1440x1080 的粗略占位: fx=fy=1440, cx=720, cy=540
camera_matrix: [1440.0, 0, 720.0, 0, 1440.0, 540.0, 0, 0, 1]
distort_coeffs: [0, 0, 0, 0, 0]
# 云台->IMUbody 旋转（IMU 装的角度和云台不一致时改）
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]
# 相机->云台 外参占位: 相机z朝前/x朝右/y朝下 -> 云台x前/y左/z上
# 装到云台上后用 calibrate_handeye 标定替换
R_camera2gimbal: [0, 0, 1, -1, 0, 0, 0, -1, 0]
t_camera2gimbal: [0, 0, 0]
# ---- 云台串口（standard_mpc 协议，io/gimbal）----
# use_gimbal: 读取云台发来的 GimbalToVision（四元数/yaw/pitch/弹速）
# send_to_gimbal: 检测到奶龙时 100Hz 下发 VisionToGimbal 世界系 yaw/pitch
use_gimbal: false
send_to_gimbal: false
com_port: "/dev/ttyACM0"

# ---- ResNet50 网格检测参数（detector 为 grid 时生效）----
model_path: "model/nailong.onnx"
input_size: 224
min_confidence: 0.8
grid_rows: 2
grid_cols: 2

# ---- 推理频率 ----
infer_every: 2               # 每 N 帧推理一次（YOLOX tiny 很快，可以设 1）

# ---- 显示 ----
show: true                   # false = 无窗口（headless，或用 --headless 参数）
